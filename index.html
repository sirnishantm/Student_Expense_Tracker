<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>💰 Student Expense Tracker</h1>
            <p>Record, manage, and monitor your daily expenses</p>
        </div>

        <div class="total-banner">
            <span class="label">Total Expenses:</span>
            <span class="amount" id="totalAmount">₹0.00</span>
        </div>

        <div class="form-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="expenseName">Expense Name</label>
                    <input type="text" id="expenseName" placeholder="e.g. Lunch, Bus fare">
                    <div class="error-msg" id="nameError"></div>
                </div>
                <div class="form-group">
                    <label for="expenseAmount">Amount (₹)</label>
                    <input type="number" id="expenseAmount" placeholder="0.00" min="0" step="1">
                    <div class="error-msg" id="amountError"></div>
                </div>
                <div class="form-group">
                    <label for="expenseCategory">Category</label>
                    <select id="expenseCategory">
                        <option value="" disabled selected>Select</option>
                        <option value="Food">🥘Food</option>
                        <option value="Travel">🧳Travel</option>
                        <option value="Shopping">🛍️Shopping</option>
                        <option value="Education">📚Education</option>
                        <option value="Other">Other</option>
                    </select>
                    <div class="error-msg" id="categoryError"></div>
                </div>
            </div>
            <button type="Submit" class="btn-add" id="btnAdd">+ Add Expense</button>
        </div>

        <div class="filter-section">
            <label for="filterCategory">Filter by:</label>
            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Food">🥘Food</option>
                <option value="Travel">🧳Travel</option>
                <option value="Shopping">🛍️Shopping</option>
                <option value="Education">📚Education</option>
                <option value="Other">Other</option>
            </select>
            <span class="filter-count" id="filterCount"></span>
        </div>

        <div class="expense-list" id="expenseList">
            <div class="empty-state" id="emptyState">
                <div class="icon">🗒️</div>
                <p>No expenses yet. Start adding your expenses above!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
